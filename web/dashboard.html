<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQTT Quiz Buzzer</title>
<script src="./mqtt.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --blue: #2848c7;
    --ink: #10162f;
    --paper: #f3f6ff;
    --orange: #ff5b35;
    --yellow: #ffd84d;
    --green: #159b68;
    --muted: #667099;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--blue);
    color: var(--ink);
    font: 16px/1.45 "Segoe UI", Arial, sans-serif;
  }
  main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
  header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 18px; }
  h1 { margin: 0; font: 900 clamp(24px, 5vw, 42px)/1 "Arial Black", Impact, sans-serif; letter-spacing: -.04em; }
  #connection { padding: 7px 11px; border: 2px solid currentColor; border-radius: 999px; font: 700 12px/1 Consolas, monospace; }
  #connection.online { color: #a9ffd9; }

  .console {
    display: grid;
    grid-template-columns: minmax(260px, .8fr) minmax(300px, 1.2fr);
    gap: 24px;
    padding: clamp(22px, 5vw, 44px);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 26px;
    box-shadow: 10px 10px 0 var(--ink);
  }
  .controls { display: grid; place-items: center; align-content: center; gap: 14px; }
  #start {
    width: 172px;
    aspect-ratio: 1;
    border: 5px solid var(--ink);
    border-radius: 50%;
    background: var(--orange);
    color: white;
    box-shadow: 0 10px 0 #a72613;
    font: 900 21px/1.1 "Arial Black", Impact, sans-serif;
    cursor: pointer;
  }
  #start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 0 #a72613; }
  #start:active:not(:disabled) { transform: translateY(7px); box-shadow: 0 3px 0 #a72613; }
  #start:disabled { filter: grayscale(.7); cursor: not-allowed; opacity: .55; }
  #reset { border: 0; background: transparent; color: var(--muted); font-weight: 800; text-decoration: underline; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 4px; }

  .scoreboard { min-height: 260px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { color: var(--muted); font: 800 12px/1 Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
  #phase { margin: 12px 0 4px; font: 900 clamp(38px, 8vw, 78px)/.96 "Arial Black", Impact, sans-serif; letter-spacing: -.06em; }
  #detail { margin: 12px 0 0; color: var(--muted); font-weight: 650; }
  .waiting #phase { color: var(--blue); }
  .armed #phase { color: var(--orange); }
  .finished { background: var(--yellow); border-radius: 18px; padding: 24px; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 38px 0 12px; color: white; }
  .section-head h2 { margin: 0; font: 900 20px/1 "Arial Black", Impact, sans-serif; }
  #count { font: 700 13px/1 Consolas, monospace; }
  #players { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .player { min-height: 130px; padding: 16px; background: white; border: 3px solid var(--ink); border-radius: 15px; box-shadow: 5px 5px 0 var(--ink); }
  .player.winner { background: var(--yellow); transform: translateY(-5px); }
  .player.offline { opacity: .55; filter: grayscale(1); }
  .player-head { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #8990a8; }
  .online .dot { background: var(--green); box-shadow: 0 0 0 4px #c8f4e3; }
  .player h3 { margin: 0; overflow-wrap: anywhere; font: 850 18px/1.2 "Segoe UI", sans-serif; }
  .device-state { margin-top: 28px; color: var(--muted); font: 700 12px/1.2 Consolas, monospace; }
  .device-state strong { color: var(--ink); }
  #empty { grid-column: 1 / -1; padding: 24px; color: white; border: 2px dashed rgba(255,255,255,.65); border-radius: 14px; text-align: center; }
  #events { margin: 12px 0 0; padding: 0; list-style: none; color: white; font: 13px/1.7 Consolas, monospace; }
  #events li { border-bottom: 1px solid rgba(255,255,255,.18); }

  @media (max-width: 760px) {
    .console { grid-template-columns: 1fr; }
    .scoreboard { min-height: 210px; text-align: center; }
    #players { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 430px) {
    main { width: min(100% - 20px, 1080px); padding-top: 16px; }
    header { align-items: flex-start; gap: 12px; }
    #players { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>MQTT QUIZ BUZZER</h1>
    <span id="connection">연결 중</span>
  </header>

  <section class="console">
    <div class="controls">
      <button id="start" disabled>START<br>ROUND</button>
      <button id="reset">게임 초기화</button>
    </div>
    <div id="scoreboard" class="scoreboard">
      <span class="eyebrow">Broker decides by arrival order</span>
      <div id="phase">대기 중</div>
      <p id="detail">보드가 연결되면 라운드를 시작하세요.</p>
    </div>
  </section>

  <div class="section-head">
    <h2>PLAYER NODES</h2>
    <span id="count">0 ONLINE</span>
  </div>
  <section id="players"><p id="empty">아직 연결된 보드가 없습니다.</p></section>

  <div class="section-head">
    <h2>EVENT LOG</h2>
  </div>
  <ul id="events"></ul>
</main>

<script>
const params = new URLSearchParams(location.search)
const host = params.get('host') || location.hostname || '127.0.0.1'
const brokerUrl = `ws://${host}:9001`
const topics = {
  state: 'classroom/game/state',
  buzz: 'classroom/game/buzz',
  winner: 'classroom/game/winner'
}

const connection = document.getElementById('connection')
const startButton = document.getElementById('start')
const resetButton = document.getElementById('reset')
const scoreboard = document.getElementById('scoreboard')
const phaseText = document.getElementById('phase')
const detail = document.getElementById('detail')
const players = document.getElementById('players')
const count = document.getElementById('count')
const events = document.getElementById('events')

const devices = {}
let connected = false
let phase = 'idle'
let winner = ''
let reactionMs = null
let accepting = false
let startedAt = 0
let roundTimer = null

const client = mqtt.connect(brokerUrl, { reconnectPeriod: 1500 })

client.on('connect', () => {
  connected = true
  connection.textContent = `ONLINE · ${brokerUrl}`
  connection.className = 'online'
  startButton.disabled = phase === 'waiting' || phase === 'armed'
  client.subscribe([
    'classroom/+/status',
    'classroom/+/led/state',
    topics.state,
    topics.buzz,
    topics.winner
  ])
  addEvent('브로커 연결됨')
})

client.on('close', () => {
  connected = false
  connection.textContent = '브로커 연결 끊김'
  connection.className = ''
  startButton.disabled = true
})

client.on('error', error => {
  connection.textContent = `연결 오류 · ${error.message}`
})

client.on('message', (topic, payload) => {
  const body = payload.toString().trim()

  if (topic === topics.state) {
    if (body.startsWith('waiting:')) {
      const target = Number(body.slice(8))
      if (!Number.isFinite(target)) return
      phase = 'waiting'
      accepting = false
      winner = ''
      reactionMs = null
      scheduleArm(target)
    } else if (body === 'armed') {
      clearTimeout(roundTimer)
      roundTimer = null
      if (phase !== 'armed') {
        startedAt = performance.now()
        winner = ''
        reactionMs = null
      }
      accepting = true
      phase = 'armed'
    } else {
      clearTimeout(roundTimer)
      roundTimer = null
      accepting = false
      phase = body || 'idle'
    }
    renderGame()
    return
  }

  if (topic === topics.winner) {
    winner = body
    if (winner) phase = 'finished'
    renderGame()
    renderPlayers()
    return
  }

  if (topic === topics.buzz) {
    if (accepting && phase === 'armed' && body) chooseWinner(body)
    return
  }

  const parts = topic.split('/')
  if (parts.length < 4 || parts[0] !== 'classroom') return
  const id = parts[1]
  const leaf = parts.slice(2).join('/')
  const device = devices[id] ||= { status: 'offline', led: false }
  if (leaf === 'status') device.status = body
  else if (leaf === 'led/state') device.led = body === 'on'
  renderPlayers()
})

startButton.onclick = () => {
  if (!connected) return
  const target = Date.now() + 2000 + Math.floor(Math.random() * 3001)
  phase = 'waiting'
  winner = ''
  reactionMs = null
  accepting = false
  client.publish(topics.winner, '', { retain: true })
  client.publish(topics.state, `waiting:${target}`, { retain: true })
  scheduleArm(target)
  addEvent('라운드 시작 · 불빛 대기')
  renderGame()
  renderPlayers()
}

resetButton.onclick = () => {
  if (!connected) return
  phase = 'idle'
  winner = ''
  reactionMs = null
  accepting = false
  clearTimeout(roundTimer)
  roundTimer = null
  client.publish(topics.winner, '', { retain: true })
  client.publish(topics.state, 'idle', { retain: true })
  addEvent('게임 초기화')
  renderGame()
  renderPlayers()
}

function chooseWinner(id) {
  accepting = false
  phase = 'finished'
  winner = id
  reactionMs = Math.round(performance.now() - startedAt)
  client.publish(topics.state, 'finished', { retain: true })
  client.publish(topics.winner, id, { retain: true })
  addEvent(`${id} 승리 · ${reactionMs} ms`)
  renderGame()
  renderPlayers()
}

function scheduleArm(target) {
  clearTimeout(roundTimer)
  roundTimer = setTimeout(() => {
    roundTimer = null
    if (connected && phase === 'waiting') {
      client.publish(topics.state, 'armed', { retain: true })
      addEvent('불빛 ON · 입력 시작')
    }
  }, Math.max(0, target - Date.now()))
}

function renderGame() {
  scoreboard.className = `scoreboard ${phase}`
  startButton.disabled = !connected || phase === 'waiting' || phase === 'armed'
  if (phase === 'waiting') {
    phaseText.textContent = '불빛을 기다리세요'
    detail.textContent = '미리 누른 입력은 인정되지 않습니다.'
  } else if (phase === 'armed') {
    phaseText.textContent = '지금 누르세요!'
    detail.textContent = '가장 먼저 도착한 BOOT 버튼 신호가 승리합니다.'
  } else if (phase === 'finished' && winner) {
    phaseText.textContent = `${winner} 승리`
    detail.textContent = reactionMs == null
      ? '승자 신호가 확정되었습니다.'
      : `대시보드 수신 기준 ${reactionMs} ms`
  } else {
    phaseText.textContent = '대기 중'
    detail.textContent = 'START ROUND를 눌러 모든 보드를 준비시키세요.'
  }
}

function renderPlayers() {
  const ids = Object.keys(devices).sort()
  const online = ids.filter(id => devices[id].status === 'online').length
  count.textContent = `${online} ONLINE`
  players.replaceChildren()

  if (!ids.length) {
    const empty = document.createElement('p')
    empty.id = 'empty'
    empty.textContent = '아직 연결된 보드가 없습니다.'
    players.append(empty)
    return
  }

  for (const id of ids) {
    const device = devices[id]
    const card = document.createElement('article')
    card.className = `player ${device.status === 'online' ? 'online' : 'offline'}${id === winner ? ' winner' : ''}`

    const head = document.createElement('div')
    head.className = 'player-head'
    const dot = document.createElement('span')
    dot.className = 'dot'
    const name = document.createElement('h3')
    name.textContent = id
    head.append(dot, name)

    const state = document.createElement('div')
    state.className = 'device-state'
    const label = document.createElement('strong')
    label.textContent = device.status === 'online' ? 'ONLINE' : 'OFFLINE'
    state.append(label, document.createTextNode(` · LED ${device.led ? 'ON' : 'OFF'}`))
    card.append(head, state)
    players.append(card)
  }
}

function addEvent(message) {
  const item = document.createElement('li')
  item.textContent = `${new Date().toLocaleTimeString()}  ${message}`
  events.prepend(item)
  while (events.children.length > 8) events.lastElementChild.remove()
}

renderGame()
renderPlayers()
</script>
</body>
</html>
