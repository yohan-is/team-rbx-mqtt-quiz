# 교실용 브로커입니다. 진행자 노트북에서 실행하세요:
#   mosquitto -c broker/mosquitto.conf -v

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# ponytail: 영구 저장을 사용하지 않습니다. 보드가 재접속하면 retained 상태를
# 바로 다시 만들 수 있습니다. 브로커 재시작 후에도 상태 보존이 필요해질 때만
# `persistence true`와 `persistence_location`을 추가하세요.
